name: Web CI

# CI for the experimental web UI (web/). Informative by design: it is NOT a
# required check for the core — a red here never blocks a core merge, and core
# changes never trigger it. The web/ tree versions and releases as its own
# release-please component.
on:
  pull_request:
    paths:
      - 'web/**'
      - 'lib/resume-pipeline/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'lib/resume-pipeline/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The web app imports the repo-root resume pipeline (lib/resume-pipeline),
      # whose modules need the root dependencies (js-yaml).
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: .
      # npm ci rejects this lockfile (npm bundled-deps bug in a Tailwind wasm package).
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
